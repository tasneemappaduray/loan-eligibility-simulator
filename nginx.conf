server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Send files smaller, so pages load faster.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Tell browsers not to guess file types, not to show the app inside another site, and not to share the address.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The app's files have a fingerprint in their name, so the browser can keep them for a year.
    location /assets/ {
        expires 1y;
    }

    # The index page must always be checked again, so a new version of the app arrives.
    location = /index.html {
        expires -1;
    }

    # Every other address shows the app, so reloading /simulator/personal_loan works.
    location / {
        try_files $uri /index.html;
    }
}
